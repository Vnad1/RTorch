[package]
name = "rtorch"
version = "0.1.4"
edition = "2024"
description = "RTorch — universal compute framework (Rust + C++), CUDA-free, OpenCL-driven. Benchmarks beyond PyTorch."

[[bin]]
name = "rtorch"
path = "src/main.rs"

[lib]
name = "rtorch"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
